name: 云端自动编译 Windows 免安装桌面端

on:
  push:
    branches:
      - main
      - 'feat/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 编译打包 Windows 客户端 (免安装直接运行)
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.11 环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 安装依赖包
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 云端预拉取离线语音大模型 (开箱即用免下载)
        shell: pwsh
        run: |
          python -c "from huggingface_hub import snapshot_download; snapshot_download(repo_id='Systran/faster-whisper-tiny', local_dir='models/faster-whisper-tiny')"

      - name: 执行 PyInstaller 编译为 Windows 免安装应用
        shell: cmd
        run: |
          python -m PyInstaller --noconfirm --clean AudioSummary.spec > pyinstaller.log 2>&1
          set PY_EXIT=%ERRORLEVEL%
          type pyinstaller.log
          if %PY_EXIT% NEQ 0 exit /b %PY_EXIT%

      - name: 上传编译日志产物 (审计排查)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pyinstaller-log
          path: pyinstaller.log
          if-no-files-found: ignore

      - name: 将内置离线模型装配入发布目录
        shell: pwsh
        run: |
          if (Test-Path "models") {
            New-Item -ItemType Directory -Force -Path "dist/AudioSummary/models"
            Copy-Item -Path "models/*" -Destination "dist/AudioSummary/models" -Recurse -Force
          }

      - name: 打包为便携 ZIP 压缩包
        shell: pwsh
        run: |
          Compress-Archive -Path dist/AudioSummary/* -DestinationPath AudioSummary-Windows-x64.zip -Force

      - name: 上传构建产物 (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: AudioSummary-Windows-x64
          path: AudioSummary-Windows-x64.zip
          retention-days: 30

      - name: 自动发布 GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v1.0.0
          name: "AudioSummary v1.0.0 - Windows 免安装版"
          body: |
            ### 标杆级全功能智能语音转写与需求总结助手 (Windows 免安装绿色版)
            
            #### 核心特性：
            - **开箱即用 · 内置离线模型**：已预装 Whisper 离线语音模型，解压后双击 `AudioSummary.exe` 直接运行，无需联网下载大模型，无需配置 Python 环境！
            - **全透明实时字幕流 (No Black Box)**：实时滚动展示带时间戳句子与推理倍速。
            - **防熔断与中文路径安全隔离**：彻底杜绝非 ASCII 路径导致的崩溃。
            - **100% 离线降级保障**：断网状态自动生成 4 份标准交付物：
              1. `[音频名]_逐字稿.txt`
              2. `[音频名]_对话记录.md`
              3. `[音频名]_会议纪要.md`
              4. `[音频名]_需求清单.md`
              5. `[音频名]_字幕.srt` (可选)
          files: AudioSummary-Windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
